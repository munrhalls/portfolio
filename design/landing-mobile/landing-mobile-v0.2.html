<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Munrhalls — landing 300×400</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14120f; --text:#e8e8e8; --muted:#a89f92; --amber:#e6b84f;
    --line:#2c271e; --line2:#403b31;
    --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0a0908;display:grid;place-items:center;font-family:var(--sans);color:var(--text)}

  /* Frame: 300×400 design size. --u = 1px at 300 wide; every dimension below is N×u,
     so the whole screen scales with the frame width. */
  .frame{width:300px;height:400px;position:relative;overflow:hidden;background:var(--bg);
         container-type:size;isolation:isolate}
  .stage{position:absolute;inset:0;--u:calc(100cqw / 300)}
  a{color:inherit;text-decoration:none}

  /* ── Main code diamond: ambient, top-right, bleeds off the edge, not clickable ── */
  .dm{position:absolute;z-index:0;pointer-events:none;
      left:calc(160*var(--u));top:calc(24*var(--u));width:calc(200*var(--u));height:calc(200*var(--u));
      mix-blend-mode:screen;               /* black pixels add no light → box disappears */
      -webkit-mask-image:linear-gradient(to bottom left,#000 30%,transparent 85%);
              mask-image:linear-gradient(to bottom left,#000 30%,transparent 85%)}
  .dm img{display:block;width:100%;height:100%;animation:drift 16s ease-in-out infinite alternate}
  @keyframes drift{
    from{transform:translate(0,0) scale(1);opacity:.8}
    to  {transform:translate(calc(-3*var(--u)),calc(4*var(--u))) scale(1.02);opacity:1}
  }

  /* ── 1 Header ── */
  .hd{position:absolute;z-index:2;left:0;right:0;top:0;height:calc(26*var(--u));
      padding:0 calc(18*var(--u));display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid var(--line)}
  .wm{font:600 calc(10*var(--u))/1 var(--mono);letter-spacing:.16em}
  .soc{display:flex;gap:calc(6*var(--u))}
  .soc a{width:calc(17*var(--u));height:calc(17*var(--u));border-radius:50%;
         border:1px solid var(--line2);display:grid;place-items:center;
         font:500 calc(5.8*var(--u))/1 var(--mono);color:var(--muted);transition:color .15s,border-color .15s}
  .soc a:hover,.soc a:focus-visible{color:var(--amber);border-color:var(--amber);outline:none}

  /* ── 2 Intro ── */
  .intro{position:absolute;z-index:2;left:calc(18*var(--u));top:calc(32*var(--u));white-space:nowrap}
  .intro b{display:block;font:600 calc(13*var(--u))/1.25 var(--sans)}
  .intro span{display:block;font:400 calc(10.5*var(--u))/1.35 var(--sans)}

  /* ── 3 Black title strip ── */
  .strip{position:absolute;z-index:2;left:0;right:0;top:calc(69*var(--u));height:calc(44*var(--u));
         background:rgba(0,0,0,.8);padding:calc(5*var(--u)) calc(18*var(--u));
         display:flex;flex-direction:column;justify-content:center;gap:calc(2*var(--u));
         font-family:var(--mono)}
  .strip div{line-height:1.3;white-space:nowrap}
  .strip .l1{font-size:calc(8.5*var(--u));color:var(--text)}
  .strip .l1 b{font-weight:600;letter-spacing:.1em;color:var(--amber)}
  .strip .l2,.strip .l3{font-size:calc(7.4*var(--u));color:var(--muted)}

  /* ── 5 Movie: 16:9 autoplaying muted inline video (simulated) ── */
  .movie{position:absolute;z-index:2;left:calc(18*var(--u));top:calc(120*var(--u));
         width:calc(264*var(--u));aspect-ratio:16/9;border-radius:calc(3*var(--u));overflow:hidden;
         background:#0d0d0d;border:1px solid var(--line2)}
  .screen{position:absolute;inset:0}
  .m-top{position:absolute;left:0;right:0;top:0;height:13%;background:#171512;border-bottom:1px solid var(--line);
         display:flex;align-items:center;justify-content:space-between;padding:0 4%}
  .m-top i{display:block;height:28%;background:var(--amber);width:20%}
  .m-top span{display:flex;gap:calc(5*var(--u))}
  .m-top span s{display:block;width:calc(14*var(--u));height:calc(2*var(--u));background:var(--line2)}
  .grid{position:absolute;left:4%;right:4%;top:17%;bottom:19%;display:grid;
        grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:4% 3%}
  .card{background:#1c1915;border:1px solid var(--line);border-radius:calc(2*var(--u));padding:6%;
        display:flex;flex-direction:column;gap:6%}
  .card u{display:block;flex:1;background:#242018;border-radius:1px}
  .card s{display:block;height:calc(2.2*var(--u));background:var(--line2);width:80%}
  .card s+s{width:45%;background:var(--line)}
  .card:nth-child(2){animation:pick1 14s infinite}
  .card:nth-child(7){animation:pick2 14s infinite}
  @keyframes pick1{0%,9%{border-color:var(--line)}12%,36%{border-color:var(--amber)}40%,100%{border-color:var(--line)}}
  @keyframes pick2{0%,47%{border-color:var(--line)}50%,72%{border-color:var(--amber)}76%,100%{border-color:var(--line)}}
  .cur{position:absolute;width:calc(7*var(--u));left:92%;top:18%;animation:cur 14s ease-in-out infinite}
  .cur svg{display:block;width:100%;height:auto}
  @keyframes cur{
    0%{left:92%;top:18%} 12%,36%{left:36%;top:33%}
    50%,72%{left:60%;top:69%} 90%,100%{left:92%;top:18%}
  }
  /* player chrome — progress is the “this is playing” signal; no play button */
  .ctl{position:absolute;left:0;right:0;bottom:0;height:calc(15*var(--u));background:rgba(10,9,8,.85);
       display:flex;align-items:center;justify-content:space-between;padding:0 calc(7*var(--u))}
  .time{font:500 calc(6.4*var(--u))/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
  .ctl svg{width:calc(9*var(--u));height:calc(9*var(--u));stroke:var(--muted);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .bar{position:absolute;left:0;right:0;bottom:calc(15*var(--u));height:calc(2.5*var(--u));background:var(--line2)}
  .bar i{display:block;height:100%;width:0;background:var(--amber);animation:prog 14s linear infinite}
  @keyframes prog{to{width:100%}}

  /* ── 6 Secondary diamond + diagonal navigation ── */
  .nav{position:absolute;left:calc(16*var(--u));top:calc(274*var(--u));
       width:calc(118*var(--u));height:calc(118*var(--u))}
  .nav .d2{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
  .nav .d2 img{display:block;width:100%;height:100%}
  .nav svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .hit{fill:rgba(0,0,0,0)}                         /* whole quadrant = tap target */
  .st{fill:rgba(20,18,15,.82);stroke:var(--line2);stroke-width:.5;transition:fill .15s}
  .nav text{font:500 7.8px var(--mono);fill:var(--text);text-anchor:middle;dominant-baseline:central;
            transition:fill .15s;pointer-events:none}
  .seg{cursor:pointer;outline:none}
  .seg:hover .st,.seg:focus-visible .st{fill:var(--amber);stroke:var(--amber)}
  .seg:hover text,.seg:focus-visible text{fill:var(--bg)}

  /* ── 7 CTA ── */
  .cta{position:absolute;z-index:3;left:calc(150*var(--u));top:calc(316*var(--u));
       width:calc(132*var(--u));height:calc(34*var(--u));border:1px solid var(--amber);color:var(--amber);
       display:flex;align-items:center;justify-content:center;gap:calc(7*var(--u));
       font:600 calc(9.5*var(--u))/1 var(--mono);letter-spacing:.14em;transition:background .15s,color .15s}
  .cta span{display:inline-block;animation:nudge 2.4s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(calc(3*var(--u)))}}
  .cta:hover,.cta:focus-visible{background:var(--amber);color:var(--bg);outline:none}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .bar i{width:38%}
  }
</style>
</head>
<body>
<main class="frame">
  <div class="stage">

    <!-- 4 Main diamond (decorative, not clickable) -->
    <div class="dm" aria-hidden="true"><img src="../code-diamond-black-bg.png" alt=""></div>

    <!-- 1 Header -->
    <header class="hd">
      <span class="wm">MUNRHALLS</span>
      <nav class="soc" aria-label="Profiles">
        <a href="#github" aria-label="GitHub">GH</a>
        <a href="#linkedin" aria-label="LinkedIn">in</a>
        <a href="#cv" aria-label="CV">CV</a>
      </nav>
    </header>

    <!-- 2 Intro -->
    <p class="intro"><b>Hi, I am Jan Pilik.</b><span>I build large-scale software products end-to-end</span></p>

    <!-- 3 Title strip -->
    <div class="strip">
      <div class="l1"><b>SANGLOGIUM.COM</b> 500+ products e-commerce store</div>
      <div class="l2">design system rwd architecture tests security performance</div>
      <div class="l3">20+ months · 4,000+ commits</div>
    </div>

    <!-- 5 Movie -->
    <div class="movie" role="img" aria-label="Autoplaying muted showcase video of sanglogium.com">
      <div class="screen">
        <div class="m-top"><i></i><span><s></s><s></s><s></s></span></div>
        <div class="grid">
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
        </div>
        <div class="cur"><svg viewBox="0 0 10 14"><path d="M0 0V11L3 8.3L5 13L6.8 12.2L4.9 7.6H8.5Z" fill="#e8e8e8" stroke="#000" stroke-width=".6"/></svg></div>
      </div>
      <div class="bar"><i></i></div>
      <div class="ctl">
        <span class="time">0:00 / 0:14</span>
        <svg viewBox="0 0 12 12" aria-label="Muted"><path d="M1.5 4.5H3.5L6 2.5V9.5L3.5 7.5H1.5Z"/><path d="M8 4.5L11 7.5M11 4.5L8 7.5"/></svg>
      </div>
    </div>

    <!-- 6 Secondary diamond: four diagonal strips, one per edge -->
    <div class="nav">
      <div class="d2" aria-hidden="true"><img src="../code-diamond-black-bg.png" alt=""></div>
      <svg viewBox="0 0 118 118" aria-label="Sections">
        <!-- top-left edge -->
        <a class="seg" href="#features" aria-label="Features">
          <polygon class="hit" points="59,59 1.8,59 59,1.8"/>
          <polygon class="st" points="2.6,58.2 58.2,2.6 58.2,18.16 18.16,58.2"/>
          <text transform="translate(34.3 34.3) rotate(-45)">FEATURES</text>
        </a>
        <!-- top-right edge -->
        <a class="seg" href="#case-studies" aria-label="Case studies">
          <polygon class="hit" points="59,59 116.2,59 59,1.8"/>
          <polygon class="st" points="115.4,58.2 59.8,2.6 59.8,18.16 99.84,58.2"/>
          <text transform="translate(83.7 34.3) rotate(45)">CASE STUDIES</text>
        </a>
        <!-- bottom-left edge -->
        <a class="seg" href="#lessons" aria-label="Lessons">
          <polygon class="hit" points="59,59 1.8,59 59,116.2"/>
          <polygon class="st" points="2.6,59.8 58.2,115.4 58.2,99.84 18.16,59.8"/>
          <text transform="translate(34.3 83.7) rotate(45)">LESSONS</text>
        </a>
        <!-- bottom-right edge -->
        <a class="seg" href="#story" aria-label="Story">
          <polygon class="hit" points="59,59 116.2,59 59,116.2"/>
          <polygon class="st" points="115.4,59.8 59.8,115.4 59.8,99.84 99.84,59.8"/>
          <text transform="translate(83.7 83.7) rotate(-45)">STORY</text>
        </a>
      </svg>
    </div>

    <!-- 7 CTA -->
    <a class="cta" href="#live">SEE IT LIVE <span>→</span></a>

  </div>
</main>

<script>
  // Keep the time readout locked to the CSS progress animation.
  (function () {
    var fill = document.querySelector('.bar i'), t = document.querySelector('.time');
    var anim = fill && fill.getAnimations && fill.getAnimations()[0];
    if (!anim) return;
    setInterval(function () {
      var s = Math.floor((Number(anim.currentTime) % 14000) / 1000);
      t.textContent = '0:' + String(s).padStart(2, '0') + ' / 0:14';
    }, 250);
  })();
</script>
</body>
</html>
