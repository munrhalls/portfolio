<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Munrhalls — landing 300×400</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14120f; --text:#ece6da; --muted:#a89f92; --amber:#e6b84f; --ambient:#8a91f2; --sink:#0a0908; --raise:#1c1915;
    --line:#2c271e; --line2:#403b31; --rule:#6a6252;
    /* tall phones: --hu = frame height in u (400 = design size). Extra height: 25% breathing room above, 75% to the video; nav+CTA ride the video's bottom edge. */
    --hu:400; --e:calc(min(max(var(--hu),400),650) - 400); --s:calc(var(--e)*.25); --v:calc(var(--e)*.75);
    --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0a0908;display:grid;place-items:center;font-family:var(--sans);color:var(--text)}

  /* Frame: 300×400 design size. --u = 1px at 300 wide; every dimension below is N×u,
     so the whole screen scales with the frame width. */
  .frame{width:300px;height:calc(var(--hu)*1px);position:relative;overflow:hidden;background:var(--bg);
         container-type:size;isolation:isolate}
  .stage{position:absolute;inset:0;--u:calc(100cqw / 300)}
  a{color:inherit;text-decoration:none}

  /* ── Background gradients: top light→dark (L→R), bottom dark→light (L→R) ── */
  .bg{position:absolute;left:0;right:0;z-index:0;pointer-events:none}
  .bg.t{top:0;height:calc((150 + var(--s))*var(--u));background:linear-gradient(to right,#27231c,#0a0908);
        -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
  .bg.b{top:calc((250 + var(--s) + var(--v))*var(--u));bottom:0;background:linear-gradient(to right,#020202,#0b0a08);
        -webkit-mask-image:linear-gradient(transparent,#000 30%);mask-image:linear-gradient(transparent,#000 30%)}
  /* ── Main code diamond: ambient, top-right, bleeds off the edge, not clickable ── */
  .dm{position:absolute;z-index:0;pointer-events:none;
      left:calc(77*var(--u));top:calc((84 + var(--s) + var(--v)*.5)*var(--u));width:calc(380*var(--u));height:calc(380*var(--u));
      mix-blend-mode:screen;               /* black pixels add no light → box disappears */
      -webkit-mask-image:linear-gradient(to bottom left,#000 35%,rgba(0,0,0,.45) 85%),linear-gradient(to right,rgba(0,0,0,.2) 54.2%,#000 59.2%),linear-gradient(#000,#000);
      -webkit-mask-size:100% 100%,100% 51.6%,100% 48.4%;-webkit-mask-position:0 0,0 0,0 100%;-webkit-mask-repeat:no-repeat;
      -webkit-mask-composite:source-in,source-over;
              mask-image:linear-gradient(to bottom left,#000 35%,rgba(0,0,0,.45) 85%),linear-gradient(to right,rgba(0,0,0,.2) 54.2%,#000 59.2%),linear-gradient(#000,#000);
              mask-size:100% 100%,100% 51.6%,100% 48.4%;mask-position:0 0,0 0,0 100%;mask-repeat:no-repeat;
              mask-composite:intersect,add}
  .dm img{display:block;width:100%;height:100%;opacity:.5}
  @keyframes drift{
    from{transform:translate(0,0) scale(1);opacity:.45}
    to  {transform:translate(calc(-3*var(--u)),calc(4*var(--u))) scale(1.02);opacity:.55}
  }

  .cglow{position:absolute;z-index:1;pointer-events:none;left:calc(233*var(--u));top:calc((-11 + var(--s))*var(--u));
         width:calc(70*var(--u));height:calc(70*var(--u));
         background:radial-gradient(circle,rgba(138,145,242,.38) 0,rgba(138,145,242,.15) 42%,transparent 70%)}
  /* ── 2 Intro ── */
  .intro{position:absolute;z-index:2;left:calc(18*var(--u));top:calc((16 + var(--s))*var(--u));width:calc(240*var(--u))}
  .contact{position:absolute;z-index:3;right:calc(18*var(--u));top:calc((10 + var(--s))*var(--u));height:calc(28*var(--u));
           display:flex;align-items:center;gap:0;color:var(--text);
           font:600 calc(9*var(--u))/1 var(--mono);letter-spacing:.14em}
  .contact .t{position:relative;z-index:1}
  .contact svg{width:calc(28*var(--u));height:calc(28*var(--u));overflow:visible;flex:none;margin-left:calc(-16.9*var(--u))}
  .contact svg polyline{fill:none;stroke:var(--text);stroke-width:1;stroke-linejoin:miter;vector-effect:non-scaling-stroke;transition:stroke .15s}
  .contact:hover svg polyline,.contact:focus-visible svg polyline{stroke:var(--amber)}
  .contact:focus-visible{outline:none}
  .intro .hi{display:block;font:500 calc(12*var(--u))/1.3 var(--sans);color:var(--text);margin-bottom:calc(4*var(--u))}
  .intro .skills{display:block;margin-top:calc(8*var(--u));width:calc(264*var(--u));white-space:nowrap;font:400 calc(9.5*var(--u))/1 var(--sans);letter-spacing:.01em;color:var(--muted);opacity:.8}
  .intro .skills i{font-style:normal;color:var(--muted);opacity:.55;padding:0 calc(2*var(--u))}
  .intro h1{margin:0;font:700 calc(15*var(--u))/1.18 var(--sans);letter-spacing:-.01em;text-wrap:balance}

  /* ── 3 Black title strip ── */
  .strip{position:absolute;z-index:2;left:0;right:0;top:calc((94 + var(--s))*var(--u));height:calc(48*var(--u));
         background:rgba(10,9,8,.8);padding:0 calc(18*var(--u));
         display:flex;flex-direction:column;justify-content:center;gap:calc(3*var(--u));font-family:var(--mono)}
  .strip .top{display:flex;justify-content:flex-start;align-items:baseline;gap:calc(7*var(--u))}
  .strip .site{font-size:calc(11*var(--u));line-height:1.1;font-weight:600;letter-spacing:.04em;color:var(--text)}
  .strip .kind{font-size:calc(9*var(--u));letter-spacing:0;color:var(--muted)}
  .strip .stats{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between}
    .strip .stats b{display:block;font-weight:600;font-size:calc(11*var(--u));line-height:1.1;color:#c9c1b2}
  .strip .stats span{display:block;margin-top:calc(1.5*var(--u));font-size:calc(9*var(--u));letter-spacing:0;color:var(--muted);white-space:nowrap}

  /* ── 5 Movie: 16:9 autoplaying muted inline video (simulated) ── */
  .movie{position:absolute;z-index:2;left:calc(18*var(--u));top:calc((148 + var(--s))*var(--u));
         width:calc(264*var(--u));height:calc((132 + var(--v))*var(--u));border-radius:calc(3*var(--u));overflow:hidden;
         background:var(--sink);border:1px solid var(--rule)}
  .screen{position:absolute;inset:0}
  .m-top{position:absolute;left:0;right:0;top:0;height:13%;background:var(--raise);border-bottom:1px solid var(--line);
         display:flex;align-items:center;justify-content:space-between;padding:0 4%}
  .m-top i{display:block;height:28%;background:var(--muted);width:20%}
  .m-top span{display:flex;gap:calc(5*var(--u))}
  .m-top span s{display:block;width:calc(14*var(--u));height:calc(2*var(--u));background:var(--line2)}
  .grid{position:absolute;left:4%;right:4%;top:17%;bottom:19%;display:grid;
        grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:4% 3%}
  .card{background:var(--raise);border:1px solid var(--line);border-radius:calc(2*var(--u));padding:6%;
        display:flex;flex-direction:column;gap:6%}
  .card u{display:block;flex:1;background:var(--line);border-radius:1px}
  .card s{display:block;height:calc(2.2*var(--u));background:var(--line2);width:80%}
  .card s+s{width:45%;background:var(--line)}
  .card:nth-child(2){animation:pick1 14s infinite}
  .card:nth-child(7){animation:pick2 14s infinite}
  @keyframes pick1{0%,9%{border-color:var(--line)}12%,36%{border-color:var(--muted)}40%,100%{border-color:var(--line)}}
  @keyframes pick2{0%,47%{border-color:var(--line)}50%,72%{border-color:var(--muted)}76%,100%{border-color:var(--line)}}
  .cur{position:absolute;width:calc(7*var(--u));left:92%;top:18%;animation:cur 14s ease-in-out infinite}
  .cur svg{display:block;width:100%;height:auto}
  @keyframes cur{
    0%{left:92%;top:18%} 12%,36%{left:36%;top:33%}
    50%,72%{left:60%;top:69%} 90%,100%{left:92%;top:18%}
  }
  /* player chrome — progress is the “this is playing” signal; no play button */
  .ctl{position:absolute;left:0;right:0;bottom:0;height:calc(15*var(--u));background:rgba(10,9,8,.85);
       display:flex;align-items:center;justify-content:space-between;padding:0 calc(7*var(--u))}
  .time{font:500 calc(8*var(--u))/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
  .ctl svg{width:calc(9*var(--u));height:calc(9*var(--u));stroke:var(--muted);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .bar{position:absolute;left:0;right:0;bottom:calc(15*var(--u));height:calc(2.5*var(--u));background:var(--line2)}
  .bar i{display:block;height:100%;width:0;background:var(--text);animation:prog 14s linear infinite}
  @keyframes prog{to{width:100%}}

  /* ── 6 Secondary diamond + diagonal navigation ── */
  .nav{position:absolute;left:calc(-23*var(--u));top:calc((261 + var(--s) + var(--v))*var(--u));
       width:calc(170*var(--u));height:calc(170*var(--u))}
  .nav .d2{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
  .nav .d2 img{display:block;width:100%;height:100%;opacity:.68;transform:scale(.86)}
  .nav svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .hit{fill:rgba(0,0,0,0)}                         /* whole quadrant = tap target */
  .st{fill:rgba(20,18,15,.82);stroke:var(--rule);stroke-width:.8;transition:fill .15s}
  .nav text{font:500 7px var(--mono);fill:var(--text);text-anchor:middle;dominant-baseline:central;
            transition:fill .15s;pointer-events:none}
  .seg{cursor:pointer;outline:none}
  .seg:hover .st,.seg:focus-visible .st{fill:var(--amber);stroke:var(--amber)}
  .seg:hover text,.seg:focus-visible text{fill:var(--bg)}

  /* ── 7 CTA ── */
  .cta{position:absolute;z-index:3;left:calc(154*var(--u));top:calc((319 + var(--s) + var(--v))*var(--u));
       width:calc(132*var(--u));height:calc(34*var(--u));color:var(--amber);
       display:flex;align-items:center;padding-left:calc(10*var(--u));
       font:600 calc(10*var(--u))/1 var(--mono);letter-spacing:.14em;transition:color .15s}
  .cta svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;z-index:0}
  .cta .lbl{position:relative;z-index:1}
  .cta .shape{fill:none;stroke:var(--amber);stroke-opacity:.55;stroke-width:1;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
  .cta .rail{stroke:url(#rl);stroke-width:1;vector-effect:non-scaling-stroke}
  .cta .rfill{fill:var(--amber);opacity:0;transition:opacity .15s}
  .cta .kg{fill:var(--amber);opacity:.55;transition:fill .15s}
  .cta .arrow{fill:none;stroke:var(--amber);stroke-width:1;stroke-linecap:butt;stroke-linejoin:miter;vector-effect:non-scaling-stroke;transition:stroke .15s}
  .cta:hover,.cta:focus-visible{outline:none}
  .cta:hover .rfill,.cta:focus-visible .rfill{opacity:1}
  .cta:hover .kg,.cta:focus-visible .kg{fill:var(--bg)}
  .cta:hover .arrow,.cta:focus-visible .arrow{stroke:var(--bg)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .bar i{width:38%}
  }
</style>
</head>
<body>
<main class="frame">
  <div class="stage">

    <div class="bg t" aria-hidden="true"></div><div class="bg b" aria-hidden="true"></div>
    <!-- 4 Main diamond (decorative, not clickable) -->
    <div class="dm" aria-hidden="true"><img src="../code-diamond-black-bg.png" alt=""></div>

    <!-- 2 Intro -->
    <div class="cglow" aria-hidden="true"></div>
    <a class="contact" href="#contact"><span class="t">CONTACT</span><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="rg" gradientUnits="userSpaceOnUse" x1="7" y1="0" x2="16" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient><mask id="rm" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="url(#rg)"/></mask><clipPath id="rc"><polygon points="5.8,6.7 12,0.5 23.5,12 12,23.5 5.8,17.3"/></clipPath></defs><g clip-path="url(#rc)" mask="url(#rm)" font-size="2.6" style="fill:var(--ambient)" font-family="'Geist Mono',monospace" text-anchor="middle"><text y="1.8" opacity="0.55"><tspan x="5.2" dy="0">ナ</tspan><tspan x="5.2" dy="2.9">コ</tspan><tspan x="5.2" dy="2.9">ハ</tspan><tspan x="5.2" dy="2.9">レ</tspan><tspan x="5.2" dy="2.9">エ</tspan><tspan x="5.2" dy="2.9">オ</tspan><tspan x="5.2" dy="2.9">モ</tspan><tspan x="5.2" dy="2.9">キ</tspan></text><text y="1.8" opacity="0.3"><tspan x="7.9" dy="0">ネ</tspan><tspan x="7.9" dy="2.9">ヨ</tspan><tspan x="7.9" dy="2.9">エ</tspan><tspan x="7.9" dy="2.9">ム</tspan><tspan x="7.9" dy="2.9">セ</tspan><tspan x="7.9" dy="2.9">ウ</tspan><tspan x="7.9" dy="2.9">カ</tspan><tspan x="7.9" dy="2.9">フ</tspan></text><text y="1.8" opacity="0.7"><tspan x="10.6" dy="0">ヒ</tspan><tspan x="10.6" dy="2.9">オ</tspan><tspan x="10.6" dy="2.9">タ</tspan><tspan x="10.6" dy="2.9">カ</tspan><tspan x="10.6" dy="2.9">ヤ</tspan><tspan x="10.6" dy="2.9">フ</tspan><tspan x="10.6" dy="2.9">エ</tspan><tspan x="10.6" dy="2.9">ユ</tspan></text><text y="1.8" opacity="0.4"><tspan x="13.3" dy="0">ク</tspan><tspan x="13.3" dy="2.9">ソ</tspan><tspan x="13.3" dy="2.9">ル</tspan><tspan x="13.3" dy="2.9">ル</tspan><tspan x="13.3" dy="2.9">ヨ</tspan><tspan x="13.3" dy="2.9">エ</tspan><tspan x="13.3" dy="2.9">ユ</tspan><tspan x="13.3" dy="2.9">ヨ</tspan></text><text y="1.8" opacity="0.55"><tspan x="16.0" dy="0">ハ</tspan><tspan x="16.0" dy="2.9">エ</tspan><tspan x="16.0" dy="2.9">ソ</tspan><tspan x="16.0" dy="2.9">ウ</tspan><tspan x="16.0" dy="2.9">ヤ</tspan><tspan x="16.0" dy="2.9">ケ</tspan><tspan x="16.0" dy="2.9">テ</tspan><tspan x="16.0" dy="2.9">ヒ</tspan></text><text y="1.8" opacity="0.3"><tspan x="18.7" dy="0">コ</tspan><tspan x="18.7" dy="2.9">モ</tspan><tspan x="18.7" dy="2.9">ク</tspan><tspan x="18.7" dy="2.9">ユ</tspan><tspan x="18.7" dy="2.9">ト</tspan><tspan x="18.7" dy="2.9">ヤ</tspan><tspan x="18.7" dy="2.9">ワ</tspan><tspan x="18.7" dy="2.9">シ</tspan></text><text y="1.8" opacity="0.7"><tspan x="21.4" dy="0">キ</tspan><tspan x="21.4" dy="2.9">ヨ</tspan><tspan x="21.4" dy="2.9">ユ</tspan><tspan x="21.4" dy="2.9">ル</tspan><tspan x="21.4" dy="2.9">ス</tspan><tspan x="21.4" dy="2.9">ネ</tspan><tspan x="21.4" dy="2.9">キ</tspan><tspan x="21.4" dy="2.9">ヤ</tspan></text></g><polyline points="5.8,6.7 12,0.5 23.5,12 12,23.5 5.8,17.3"/></svg></a>
    <div class="intro"><span class="hi">Hi, I’m Jan Pilik.</span><h1>I build large&#8209;scale software products end to end</h1><span class="skills">Design<i>·</i>Architecture<i>·</i>Full stack<i>·</i>Tests &amp; CI/CD</span></div>

    <!-- 3 Title strip -->
    <div class="strip">
      <div class="top"><div class="site">SANGLOGIUM.COM</div><div class="kind">E-commerce store</div></div>
      <div class="stats">
        <div><b>20+</b><span>Months</span></div>
        <div><b>4,000+</b><span>Commits</span></div>
        <div><b>500+</b><span>Products</span></div>
        <div><b>17</b><span>Professional features</span></div>
      </div>
    </div>

    <!-- 5 Movie -->
    <div class="movie" role="img" aria-label="Autoplaying muted showcase video of sanglogium.com">
      <div class="screen">
        <div class="m-top"><i></i><span><s></s><s></s><s></s></span></div>
        <div class="grid">
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
          <div class="card"><u></u><s></s><s></s></div>
        </div>
        <div class="cur"><svg viewBox="0 0 10 14"><path d="M0 0V11L3 8.3L5 13L6.8 12.2L4.9 7.6H8.5Z" fill="#e8e8e8" stroke="#000" stroke-width=".6"/></svg></div>
      </div>
      <div class="bar"><i></i></div>
      <div class="ctl">
        <span class="time">0:00 / 0:14</span>
        <svg viewBox="0 0 12 12" aria-label="Muted"><path d="M1.5 4.5H3.5L6 2.5V9.5L3.5 7.5H1.5Z"/><path d="M8 4.5L11 7.5M11 4.5L8 7.5"/></svg>
      </div>
    </div>

    <!-- 6 Secondary diamond: four diagonal strips, one per edge -->
    <div class="nav">
      <div class="d2" aria-hidden="true"><img src="../code-diamond-black-bg.png" alt=""></div>
      <svg viewBox="0 0 118 118" aria-label="Sections">
        <!-- top-left edge -->
        <a class="seg" href="#features" aria-label="Features">
          <polygon class="hit" points="59,59 1.8,59 59,1.8"/>
          <polygon class="st" points="2.6,58.2 58.2,2.6 58.2,18.16 18.16,58.2"/>
          <text transform="translate(34.3 34.3) rotate(-45)">FEATURES</text>
        </a>
        <!-- top-right edge -->
        <a class="seg" href="#case-studies" aria-label="Case studies">
          <polygon class="hit" points="59,59 116.2,59 59,1.8"/>
          <polygon class="st" points="115.4,58.2 59.8,2.6 59.8,18.16 99.84,58.2"/>
          <text transform="translate(83.7 34.3) rotate(45)">CASE STUDIES</text>
        </a>
        <!-- bottom-left edge -->
        <a class="seg" href="#lessons" aria-label="Lessons">
          <polygon class="hit" points="59,59 1.8,59 59,116.2"/>
          <polygon class="st" points="2.6,59.8 58.2,115.4 58.2,99.84 18.16,59.8"/>
          <text transform="translate(34.3 83.7) rotate(45)">LESSONS</text>
        </a>
        <!-- bottom-right edge -->
        <a class="seg" href="#story" aria-label="Story">
          <polygon class="hit" points="59,59 116.2,59 59,116.2"/>
          <polygon class="st" points="115.4,59.8 59.8,115.4 59.8,99.84 99.84,59.8"/>
          <text transform="translate(83.7 83.7) rotate(-45)">STORY</text>
        </a>
      </svg>

    if (!anim) return;
    setInterval(function () {
