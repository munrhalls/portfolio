<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8"><style id="vsc-direct-styles">/* Styles pour les contrôles de vitesse injectés */

/* S'assurer que le parent de la vidéo peut positionner correctement les contrôleurs */
video.vsc-initialized, .vsc-initialized {
  position: relative !important;
}

/* Style pour le contrôleur */
.vsc-controller {
  position: absolute !important;
  background: linear-gradient(180deg, rgba(30, 27, 24, 0.92) 0%, rgba(13, 12, 11, 0.92) 100%) !important;
  color: #fff7de !important;
  border-radius: 12px !important;
  padding: 8px !important;
  z-index: 9999999 !important;
  font-family: Arial, sans-serif !important;
  font-size: 14px !important;
  display: flex !important;
  align-items: center !important;
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35) !important;
  transition: opacity 0.2s ease-in-out !important;
  user-select: none !important;
  opacity: 0.6 !important;
  border: 1px solid rgba(247, 197, 29, 0.22) !important;
  backdrop-filter: blur(8px) !important;
  box-sizing: border-box !important;
  line-height: 1 !important;
}

.vsc-controller:hover {
  opacity: 1 !important;
}

.vsc-controller.vsc-hidden {
  display: none !important;
}

.vsc-controller.vsc-top {
  top: 5px !important;
  right: 5px !important;
}

.vsc-controller.vsc-bottom {
  bottom: 5px !important;
  right: 5px !important;
}

.vsc-controller button {
  background: rgba(27, 24, 20, 0.9) !important;
  border: 1px solid #f7c51d !important;
  color: #f7c51d !important;
  font-size: 16px !important;
  cursor: pointer !important;
  width: 30px !important;
  height: 30px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 0 !important;
  margin: 0 3px !important;
  border-radius: 50% !important;
  transition: background-color 0.2s !important;
  box-sizing: border-box !important;
  line-height: 1 !important;
}

.vsc-controller button:hover {
  background-color: #f7c51d !important;
  color: #171412 !important;
  transform: scale(1.1) !important;
}

.vsc-controller button:active {
  background-color: #d9a90d !important;
  color: #171412 !important;
}

.vsc-controller-speed {
  font-weight: bold !important;
  margin: 0 8px !important;
  min-width: 58px !important;
  text-align: center !important;
  font-size: 16px !important;
  background-color: rgba(0, 0, 0, 0.35) !important;
  padding: 4px 8px !important;
  border-radius: 999px !important;
  color: #f7c51d !important;
  border: 1px solid rgba(247, 197, 29, 0.24) !important;
  box-sizing: border-box !important;
  line-height: 1 !important;
  white-space: nowrap !important;
}

/* Icônes des boutons */
.vsc-controller-slower::before {
  content: "−" !important;
  font-size: 20px !important;
  font-weight: bold !important;
}

.vsc-controller-faster::before {
  content: "+" !important;
  font-size: 20px !important;
  font-weight: bold !important;
}

.vsc-controller-reset::before {
  content: "1x" !important;
  font-size: 14px !important;
  font-weight: bold !important;
}

.vsc-controller-toggle::before {
  content: "⇄" !important;
  font-size: 18px !important;
  font-weight: bold !important;
}

/* Indicateur de vitesse */
.vsc-speed-indicator {
  position: fixed;
  bottom: 70px;
  right: 20px;
  background: linear-gradient(180deg, rgba(30, 27, 24, 0.95) 0%, rgba(13, 12, 11, 0.95) 100%);
  color: #f7c51d;
  padding: 12px 16px;
  border-radius: 999px;
  font-family: Arial, sans-serif;
  font-size: 16px;
  font-weight: bold;
  z-index: 9999;
  transition: opacity 0.3s ease;
  pointer-events: none;
  border: 1px solid rgba(247, 197, 29, 0.3);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.34);
  backdrop-filter: blur(8px);
}
